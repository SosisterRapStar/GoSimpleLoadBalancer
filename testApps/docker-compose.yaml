version: "3.8"

services:
  server1:
    build: .
    ports:
      - "8000:8000"
    environment:
      SERVER_NUM: "1"
    volumes:
      - ./logs/server1:/logs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  server2:
    build: .
    ports:
      - "8001:8001"
    environment:
      SERVER_NUM: "2"
    volumes:
      - ./logs/server2:/logs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]

  server3:
